version: '3.9'

services:
  app:
    image: foodsys:1.0          # your Docker image
    container_name: foodsys_app
    ports:
      - "8080:8080"             # map host port to container port (adjust if your app uses a different port)
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=fooddb
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: foodsys_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fooddb
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
